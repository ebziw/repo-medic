<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="repo-medic logo: medical cross with code brackets">
  <title>repo-medic</title>
  <desc>Red circle with a white medical cross flanked by curly braces, with the wordmark "repo-medic" below.</desc>

  <!-- Background circle (medical red) -->
  <circle cx="128" cy="120" r="100" fill="#dc2626" />

  <!-- White medical cross (centered) -->
  <rect x="108" y="60"  width="40" height="120" rx="4" fill="#ffffff" />
  <rect x="68"  y="100" width="120" height="40" rx="4" fill="#ffffff" />

  <!-- Left curly brace  -->
  <text x="22" y="148" font-family="ui-monospace, 'SF Mono', Consolas, monospace"
        font-size="110" font-weight="700" fill="#dc2626">{</text>

  <!-- Right curly brace -->
  <text x="208" y="148" font-family="ui-monospace, 'SF Mono', Consolas, monospace"
        font-size="110" font-weight="700" fill="#dc2626">}</text>

  <!-- Wordmark -->
  <text x="128" y="248" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="700" fill="#0f172a" letter-spacing="0.5">
    repo-medic
  </text>
</svg>
